name: Frontend CI

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "library-fe/**"
  pull_request:
    branches: ["main"]
    paths:
      - "library-fe/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./library-fe

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./library-fe/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

        env:
          VITE_API_URL: http://localhost:4000
          VITE_BASE_URL: http://localhost:5173
          VITE_BETTER_AUTH_URL: http://localhost:4000
          VITE_CLOUDINARY_CLOUD_NAME: deifn0fgm
